name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sudoku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet github.com/Sili-Sudoku/api/...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/sudoku
        run: go test -race github.com/Sili-Sudoku/api/...
