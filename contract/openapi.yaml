# Generated by `npm run contract` in the web repo. Do not edit by hand.
openapi: "3.1.0"
info:
  title: "Sili Sudoku API"
  version: "0.1.0"
  description: "Optional backend. The web app solves, authors and imports without it. The browser calls it on the same origin under /api, so a path here is /v1/... and the reverse proxy strips /api. Every POST, PUT, PATCH and DELETE needs the X-Requested-With: sudoku header (CSRF protection). All text fields are plain text."
servers:
  - url: "/api"
components:
  securitySchemes:
    session:
      type: "apiKey"
      in: "cookie"
      name: "session"
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
          description: "Short message for people."
        code:
          type: "string"
          description: "Stable code for programs, for example username_taken."
    Username:
      type: "string"
      pattern: "^[A-Za-z0-9_]{3,24}$"
    User:
      type: "object"
      required:
        - "username"
        - "bio"
        - "createdAt"
        - "isAdmin"
      properties:
        username:
          "$ref": "#/components/schemas/Username"
        bio:
          type: "string"
          maxLength: 500
          description: "Plain text."
        email:
          type: "string"
          description: "Only in your own account. Not verified."
        createdAt:
          type: "string"
          format: "date-time"
        isAdmin:
          type: "boolean"
    Profile:
      type: "object"
      required:
        - "username"
        - "bio"
        - "createdAt"
        - "followers"
        - "following"
        - "followed"
        - "me"
      properties:
        username:
          "$ref": "#/components/schemas/Username"
        bio:
          type: "string"
          maxLength: 500
          description: "Plain text. Never render it as HTML."
        createdAt:
          type: "string"
          format: "date-time"
        followers:
          type: "integer"
        following:
          type: "integer"
        followed:
          type: "boolean"
          description: "You follow this creator."
        me:
          type: "boolean"
          description: "This is you."
    Verdict:
      type: "object"
      required:
        - "valid"
        - "solutions"
      description: "The result of the validate-puzzle tool."
      properties:
        valid:
          type: "boolean"
        solutions:
          enum:
            - "none"
            - "one"
            - "many"
            - "unknown"
        errors:
          type: "array"
          items:
            type: "string"
    PuzzleStatus:
      enum:
        - "pending"
        - "published"
        - "rejected"
    SudokuPadData:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "string"
          description: "The scl data, as sudokupad.app gave it."
    PublishResult:
      type: "object"
      required:
        - "id"
        - "status"
      properties:
        id:
          type: "string"
        status:
          "$ref": "#/components/schemas/PuzzleStatus"
        deleteToken:
          type: "string"
          description: "Shown once, and only to a signed-out publisher."
    PuzzleSummary:
      type: "object"
      description: "What a list shows. All text is plain text."
      properties:
        id:
          type: "string"
        title:
          type: "string"
        author:
          type: "string"
          description: "Author credit from the puzzle metadata."
        source:
          type: "string"
          description: "Source link from the puzzle metadata. Shown as text."
        difficulty:
          type: "string"
        tags:
          type: "array"
          items:
            type: "string"
        variants:
          type: "array"
          items:
            type: "string"
          description: "Definitions the puzzle uses."
        owner:
          type:
            - "string"
            - "null"
          description: "Username of the owner, or null."
        createdAt:
          type: "string"
          format: "date-time"
        ratingCount:
          type: "integer"
          description: "How many people gave stars."
        rating:
          type: "number"
          description: "Mean stars, 1 decimal. 0 when there are no votes."
        difficultyCount:
          type: "integer"
        feltDifficulty:
          type: "number"
          description: "Mean felt difficulty 1 to 5, 1 decimal. 0 when none."
      required:
        - "id"
        - "title"
        - "tags"
        - "variants"
        - "owner"
        - "createdAt"
        - "ratingCount"
        - "rating"
        - "difficultyCount"
        - "feltDifficulty"
    RatingSummary:
      type: "object"
      required:
        - "ratingCount"
        - "rating"
        - "difficultyCount"
        - "feltDifficulty"
        - "mine"
      properties:
        ratingCount:
          type: "integer"
        rating:
          type: "number"
        difficultyCount:
          type: "integer"
        feltDifficulty:
          type: "number"
        mine:
          type:
            - "object"
            - "null"
          description: "The signed-in user's own rating. 0 means not given."
          properties:
            stars:
              type: "integer"
            difficulty:
              type: "integer"
    Comment:
      type: "object"
      required:
        - "id"
        - "author"
        - "text"
        - "createdAt"
        - "mine"
      properties:
        id:
          type: "integer"
        author:
          type:
            - "string"
            - "null"
          description: "Username, or null if the account is gone."
        text:
          type: "string"
          maxLength: 2000
          description: "Plain text. Never render it as HTML."
        createdAt:
          type: "string"
          format: "date-time"
        mine:
          type: "boolean"
    HistoryEntry:
      type: "object"
      required:
        - "puzzleId"
        - "title"
        - "seconds"
        - "solvedAt"
        - "updatedAt"
      properties:
        puzzleId:
          type: "string"
          description: "A bundled puzzle id or a published puzzle id."
        title:
          type:
            - "string"
            - "null"
          description: "Only for a published puzzle that still exists."
        seconds:
          type:
            - "integer"
            - "null"
          description: "The best solve time."
        solvedAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    PuzzleResponse:
      type: "object"
      required:
        - "id"
        - "status"
      properties:
        id:
          type: "string"
        status:
          "$ref": "#/components/schemas/PuzzleStatus"
        verdict:
          "$ref": "#/components/schemas/Verdict"
        puzzle:
          "$ref": "puzzle-definition.schema.json"
          description: "Only when published, or for the owner."
paths:
  "/healthz":
    get:
      operationId: "health"
      responses:
        "204":
          description: "The API is up."
  "/v1/sudokupad":
    get:
      operationId: "fetchSudokuPad"
      summary: "Read a puzzle from a short sudokupad.app link for the browser, which cannot (no CORS headers). Limited per client address and for everybody together."
      parameters:
        - name: "id"
          in: "query"
          required: true
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_-]{4,40}(/[A-Za-z0-9_-]{2,40})?$"
      responses:
        "200":
          description: "The puzzle data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SudokuPadData"
        "400":
          description: "Not a SudokuPad puzzle id (code bad_id)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "sudokupad.app has no puzzle for this id (code not_found)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many imports from this address (code rate_limited) or from everybody (code busy)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "sudokupad.app cannot be read right now (code upstream)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/accounts":
    post:
      operationId: "signUp"
      summary: "Sign up. Also signs in: the response sets the session cookie."
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "username"
                - "password"
              properties:
                username:
                  "$ref": "#/components/schemas/Username"
                password:
                  type: "string"
                  minLength: 10
                  maxLength: 200
                email:
                  type: "string"
                  maxLength: 254
                  description: "Optional. Not verified."
      responses:
        "201":
          description: "Account created."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "user"
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
        "400":
          description: "Invalid username, password or email (code invalid_username, weak_password, invalid_email)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Username taken (code username_taken)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many attempts (code rate_limited)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/sessions":
    post:
      operationId: "logIn"
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "username"
                - "password"
              properties:
                username:
                  type: "string"
                password:
                  type: "string"
      responses:
        "200":
          description: "Signed in. Sets the session cookie."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "user"
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
        "401":
          description: "Wrong username or password (code bad_credentials). The message is the same for both."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many attempts (code rate_limited)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/sessions/current":
    delete:
      operationId: "logOut"
      security:
        - session: []
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      responses:
        "204":
          description: "Signed out. The cookie is cleared."
  "/v1/me":
    patch:
      operationId: "patchMe"
      summary: "Change your public bio."
      security:
        - session: []
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                bio:
                  type: "string"
                  maxLength: 500
      responses:
        "200":
          description: "The updated user."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "user"
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
        "400":
          description: "Over 500 characters (code invalid_bio)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    get:
      operationId: "getMe"
      security:
        - session: []
      responses:
        "200":
          description: "The signed-in user."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "user"
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
        "401":
          description: "Not signed in (code unauthenticated)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: "deleteMe"
      summary: "Delete the account, its sessions and the data tied to it."
      security:
        - session: []
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "password"
                - "puzzles"
              properties:
                password:
                  type: "string"
                puzzles:
                  enum:
                    - "keep"
                    - "delete"
                  description: "What happens to your published puzzles: keep them without an owner, or delete them."
      responses:
        "204":
          description: "Deleted."
        "400":
          description: "puzzles missing or not keep|delete."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not signed in, or wrong password."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles":
    get:
      operationId: "listPuzzles"
      summary: "Published puzzles, newest first. Puzzles with 3 reports are left out until an admin reviews them."
      parameters:
        - name: "author"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "tag"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "variant"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "difficulty"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sort"
          in: "query"
          required: false
          schema:
            enum:
              - "newest"
              - "top"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 50
            default: 20
        - name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "A page."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "items"
                  - "nextCursor"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/PuzzleSummary"
                  nextCursor:
                    type: "string"
                    description: "Empty at the end."
        "400":
          description: "Bad limit, cursor or sort."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: "publishPuzzle"
      summary: "Publish a puzzle. It is stored as pending and checked in the background."
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "puzzle-definition.schema.json"
      responses:
        "202":
          description: "Accepted as pending."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublishResult"
        "400":
          description: "Not JSON, or a text field is too long or the source is not an https link (code invalid_puzzle)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "Over 256 KiB."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many attempts (code rate_limited)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles/{id}":
    get:
      operationId: "getPuzzle"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "The puzzle, or its status."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PuzzleResponse"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: "deletePuzzle"
      summary: "Delete a puzzle as its owner (session) or with the delete token."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
        - name: "X-Delete-Token"
          in: "header"
          required: false
          schema:
            type: "string"
      responses:
        "204":
          description: "Deleted."
        "403":
          description: "Not the owner and no valid token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles/{id}/owner":
    put:
      operationId: "claimPuzzle"
      summary: "Attach a puzzle that was published signed out to your account. The delete token is the proof."
      security:
        - session: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
        - name: "X-Delete-Token"
          in: "header"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Claimed, or already yours."
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Wrong token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Someone else owns it (code already_owned)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles/{id}/report":
    post:
      operationId: "reportPuzzle"
      summary: "Report a puzzle. One report per user. Three reports hide it from lists."
      security:
        - session: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      responses:
        "204":
          description: "Reported."
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles/{id}/ratings":
    get:
      operationId: "getRatings"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Totals, and your own rating when signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RatingSummary"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    put:
      operationId: "putRating"
      summary: "Set your rating. stars and difficulty are 0 (not given) or 1 to 5. Both 0 removes it."
      security:
        - session: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                stars:
                  type: "integer"
                  minimum: 0
                  maximum: 5
                difficulty:
                  type: "integer"
                  minimum: 0
                  maximum: 5
      responses:
        "200":
          description: "New totals."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RatingSummary"
        "400":
          description: "Out of range."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Your own puzzle (code own_puzzle)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles/{id}/comments":
    get:
      operationId: "listComments"
      summary: "Comments, newest first. Comments with 3 reports are left out until an admin reviews them."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 50
            default: 20
        - name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "A page."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "items"
                  - "nextCursor"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Comment"
                  nextCursor:
                    type: "string"
        "400":
          description: "Bad limit or cursor."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: "postComment"
      security:
        - session: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "text"
              properties:
                text:
                  type: "string"
                  maxLength: 2000
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Comment"
        "400":
          description: "Empty or over 2000 characters."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many comments (code rate_limited)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/puzzles/{id}/stats":
    get:
      operationId: "getSolveStats"
      summary: "How many people solved the puzzle and the median time, from users who sync their history."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Stats."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "solves"
                  - "medianSeconds"
                properties:
                  solves:
                    type: "integer"
                  medianSeconds:
                    type:
                      - "integer"
                      - "null"
        "404":
          description: "Not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/history":
    get:
      operationId: "listHistory"
      summary: "Your synced solve history, most recently changed first. Only exists if you turned sync on."
      security:
        - session: []
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 50
            default: 20
        - name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "A page."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "items"
                  - "nextCursor"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/HistoryEntry"
                  nextCursor:
                    type: "string"
        "400":
          description: "Bad limit or cursor."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: "deleteHistory"
      summary: "Delete all of your synced history."
      security:
        - session: []
      parameters:
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      responses:
        "204":
          description: "Deleted."
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/history/{puzzleId}":
    put:
      operationId: "putHistory"
      summary: "Merge one solve into your history. The lower time wins. Safe to repeat."
      security:
        - session: []
      parameters:
        - name: "puzzleId"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "X-Requested-With"
          in: "header"
          required: true
          schema:
            const: "sudoku"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                seconds:
                  type:
                    - "integer"
                    - "null"
                  minimum: 1
                  maximum: 8640000
                solvedAt:
                  type:
                    - "string"
                    - "null"
                  format: "date-time"
      responses:
        "200":
          description: "The merged entry."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HistoryEntry"
        "400":
          description: "Bad id, time or date."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not signed in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "History is full: 5000 puzzles (code history_full)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
